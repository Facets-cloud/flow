name: Publish GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/demo/**'
      - 'scripts/build_site.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble publish tree
        # scripts/build_site.py: copies site/ to out/, replaces the demo/
        # symlink with docs/demo/, splices site/built-with-flow.html into
        # index.html at the <!-- built-with-flow --> marker, adds .nojekyll.
        # `make site` runs the same script locally.
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts
          python3 scripts/build_site.py out
          echo "--- publish tree ---"
          find out -maxdepth 2 -print

      - name: Deploy to gh-pages (orphan)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'deploy: ${{ github.sha }}'
